<!DOCTYPE html>
<html>
<head>
    <title>APL Host Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="hero">

    <h1>👑 HOST DASHBOARD</h1>
    <h2>APL Auction Control Center</h2>

    <div style="background:white;color:black;padding:30px;border-radius:20px;max-width:900px;margin:auto;">

        <h3>Create Auction Room</h3>

        <input
            type="text"
            id="auctionName"
            placeholder="Auction Name"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <input
            type="number"
            id="purse"
            value="100"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <input
            type="number"
            id="timer"
            value="20"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <button onclick="createAuction()">
            CREATE AUCTION
        </button>

        <br><br>

        <div id="result"></div>

        <hr style="margin:30px 0;">

        <h3>Teams</h3>

        <input
            type="text"
            id="team1"
            value="The Masters"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <input
            type="text"
            id="team2"
            value="The Legends"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <input
            type="text"
            id="team3"
            value="The Royals"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <input
            type="text"
            id="team4"
            value="The Titans"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <button onclick="generateLinks()">
            GENERATE TEAM LINKS
        </button>

        <br><br>

        <div id="links"></div>

        <hr style="margin:30px 0;">

        <h3>🏏 Add Player</h3>

        <input
            type="text"
            id="playerName"
            placeholder="Player Name"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <input
            type="text"
            id="playerRole"
            placeholder="Designation (Batsman / Bowler / All Rounder)"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <select
            id="playerGrade"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >
            <option value="A">Grade A</option>
            <option value="B">Grade B</option>
            <option value="C">Grade C</option>
        </select>

        <input
            type="text"
            id="playerPhoto"
            placeholder="Player Photo URL"
            style="width:100%;padding:12px;margin-bottom:10px;"
        >

        <button onclick="addPlayer()">
            ADD PLAYER
        </button>

        <br><br>

        <div id="playerList"></div>

    </div>

</div>

<script>

let currentRoomCode = "";
let players = [];

function createAuction(){

    currentRoomCode =
        "APL" +
        Math.floor(Math.random()*10000);

    document.getElementById("result").innerHTML = `
        <h2>✅ Auction Created</h2>

        <p><b>Room Code:</b> ${currentRoomCode}</p>

        <p>Share this Room Code with all captains.</p>
    `;
}

function generateLinks(){

    if(currentRoomCode === ""){
        alert("Please create auction first.");
        return;
    }

    const team1 =
        document.getElementById("team1").value;

    const team2 =
        document.getElementById("team2").value;

    const team3 =
        document.getElementById("team3").value;

    const team4 =
        document.getElementById("team4").value;

    document.getElementById("links").innerHTML = `

        <h3>🏏 Captain Links</h3>

        <p><b>${team1}</b><br>
        captain.html?team=masters&room=${currentRoomCode}</p>

        <p><b>${team2}</b><br>
        captain.html?team=legends&room=${currentRoomCode}</p>

        <p><b>${team3}</b><br>
        captain.html?team=royals&room=${currentRoomCode}</p>

        <p><b>${team4}</b><br>
        captain.html?team=titans&room=${currentRoomCode}</p>

    `;
}

function addPlayer(){

    const name =
    document.getElementById("playerName").value;

    const role =
    document.getElementById("playerRole").value;

    const grade =
    document.getElementById("playerGrade").value;

    const photo =
    document.getElementById("playerPhoto").value;

    let basePrice = 50;

    if(grade === "B") basePrice = 30;
    if(grade === "C") basePrice = 20;

    players.push({
        name,
        role,
        grade,
        basePrice,
        photo
    });

    renderPlayers();

    document.getElementById("playerName").value = "";
    document.getElementById("playerRole").value = "";
    document.getElementById("playerPhoto").value = "";
}

function renderPlayers(){

    let html = "<h3>Registered Players</h3>";

    players.forEach((player)=>{

        html += `
        <div style="
            border:1px solid #ddd;
            padding:15px;
            margin-bottom:10px;
            border-radius:10px;
        ">
            <b>${player.name}</b><br>
            ${player.role}<br>
            Grade ${player.grade}<br>
            Base Price ₹${player.basePrice}L
        </div>
        `;
    });

    document.getElementById("playerList").innerHTML = html;
}

</script>

</body>
</html>
