<!DOCTYPE html>
<html>
<head>
    <title>APL Host Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="hero">

    <h1>👑 HOST DASHBOARD</h1>
    <h2>APL Auction Control Center</h2>

    <div style="background:white;color:black;padding:30px;border-radius:20px;max-width:900px;margin:auto;">

        <h3>Create Auction Room</h3>

        <input type="text" id="auctionName" placeholder="Auction Name"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <input type="number" id="purse" value="100"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <input type="number" id="timer" value="20"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <button onclick="createAuction()">CREATE AUCTION</button>

        <div id="result"></div>

        <hr style="margin:30px 0;">

        <h3>Teams</h3>

        <input type="text" id="team1" value="The Masters"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <input type="text" id="team2" value="The Legends"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <input type="text" id="team3" value="The Royals"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <input type="text" id="team4" value="The Titans"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <button onclick="generateLinks()">GENERATE TEAM LINKS</button>

        <div id="links"></div>

        <hr style="margin:30px 0;">

        <h3>🏏 Add Player</h3>

        <input type="text" id="playerName" placeholder="Player Name"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <input type="text" id="playerRole" placeholder="Role"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <select id="playerGrade"
        style="width:100%;padding:12px;margin-bottom:10px;">
            <option value="A">Grade A</option>
            <option value="B">Grade B</option>
            <option value="C">Grade C</option>
        </select>

        <!-- IMAGE UPLOAD -->
        <input type="file" id="playerPhoto" accept="image/*"
        style="width:100%;padding:12px;margin-bottom:10px;">

        <button onclick="addPlayer()">ADD PLAYER</button>

        <div id="playerList"></div>

    </div>
</div>

<script>

let currentRoomCode = "";
let players = [];

function createAuction(){

    currentRoomCode = "APL" + Math.floor(Math.random()*10000);

    document.getElementById("result").innerHTML =
    `<h2>✅ Auction Created</h2>
    <p><b>Room Code:</b> ${currentRoomCode}</p>`;
}

function generateLinks(){

    if(currentRoomCode === ""){
        alert("Create auction first");
        return;
    }

    document.getElementById("links").innerHTML = `
    <h3>Captain Links</h3>

    The Masters:
    captain.html?team=masters&room=${currentRoomCode}<br><br>

    The Legends:
    captain.html?team=legends&room=${currentRoomCode}<br><br>

    The Royals:
    captain.html?team=royals&room=${currentRoomCode}<br><br>

    The Titans:
    captain.html?team=titans&room=${currentRoomCode}
    `;
}

function addPlayer(){

    let name = document.getElementById("playerName").value;
    let role = document.getElementById("playerRole").value;
    let grade = document.getElementById("playerGrade").value;

    let file = document.getElementById("playerPhoto").files[0];

    let photoURL = "";

    if(file){
        photoURL = URL.createObjectURL(file);
    }

    let basePrice = 50;

    if(grade === "B") basePrice = 30;
    if(grade === "C") basePrice = 20;

    players.push({
        name,
        role,
        grade,
        basePrice,
        photoURL
    });

    renderPlayers();

    document.getElementById("playerName").value = "";
    document.getElementById("playerRole").value = "";
    document.getElementById("playerPhoto").value = "";
}

function renderPlayers(){

    let html = "<h3>Registered Players</h3>";

    players.forEach(p => {

        html += `
        <div style="border:1px solid #ddd;padding:10px;margin:10px;border-radius:10px;">

            <img src="${p.photoURL}"
            width="100"
            height="100"
            style="border-radius:10px;object-fit:cover;">

            <br><b>${p.name}</b>
            <br>${p.role}
            <br>Grade ${p.grade}
            <br>₹${p.basePrice}L

        </div>
        `;
    });

    document.getElementById("playerList").innerHTML = html;
}

</script>

</body>
</html>
